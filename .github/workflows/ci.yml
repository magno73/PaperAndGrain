name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Xcode that has the macOS 26 SDK the app needs for Liquid Glass.
          - name: Xcode 26.6 on macOS 26
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
          # The toolchain the app is developed with.
          - name: Xcode 27.2 on macOS 27
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "${{ matrix.xcode }}"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
